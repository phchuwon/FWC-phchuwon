<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics</title>

    <style>
        body {
            background-color: pink;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 50px;
        }

        .shops {
            display: flex;
            justify-content: center;
            gap: 30px;
            text-align: center;
        }

        .shop {
            width: 300px;
        }

        .shop img {
            width: 300px;
            height: 200px;
            object-fit: cover;
        }

        hr {
            margin-top: 30px;
        }

        .copyright {
            text-align: right;
            font-family: monospace;
            font-style: italic;
        }
    </style>
</head>

<body>

    <h1>Basics ♥</h1>

    <div class="shops">

        <div class="shop">
            <img src="https://placehold.co/300x200?text=Amazon" alt="Amazon">
            <br>
            <a href="https://www.amazon.com/">Amazon</a>
        </div>

        <div class="shop">
            <img src="https://placehold.co/300x200?text=eBay" alt="eBay">
            <br>
            <a href="https://www.ebay.com/">eBay</a>
        </div>

    </div>

    <hr>

    <p class="copyright">© 68100124-debug 2026</p>

</body>
</html>
