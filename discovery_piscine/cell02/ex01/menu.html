<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNCF Sandwich</title>
    <link rel="stylesheet" href="menu.css">
</head>

<body>

    <div class="sandwich">
        <h1>🥪 SNCF Sandwich</h1>
        <p class="subtitle">Create your own sandwich</p>

        <div class="menu">
            <label for="bread">🍞 Choose your bread</label>
            <select id="bread">
                <option>White bread</option>
                <option>Whole wheat bread</option>
                <option>Baguette</option>
                <option>Multigrain bread</option>
            </select>

            <label for="cheese">🧀 Choose your cheese</label>
            <select id="cheese">
                <option>Cheddar</option>
                <option>Swiss cheese</option>
                <option>Brie</option>
                <option>Goat cheese</option>
            </select>

            <label for="meat">🥩 Choose your meat</label>
            <select id="meat">
                <option>Ham</option>
                <option>Chicken</option>
                <option>Turkey</option>
                <option>Beef</option>
            </select>

            <label for="vegetables">🥬 Choose your vegetables</label>
            <select id="vegetables">
                <option>Lettuce</option>
                <option>Tomato</option>
                <option>Cucumber</option>
                <option>Onion</option>
            </select>

            <label for="sauce">🥫 Choose your sauce</label>
            <select id="sauce">
                <option>Mayonnaise</option>
                <option>Mustard</option>
                <option>Tomato sauce</option>
                <option>Garlic sauce</option>
            </select>
        </div>

        <p class="bottom">Bon appétit! 🚆</p>
    </div>

</body>
</html>
